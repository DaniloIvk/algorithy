server {
	listen 80;
	root /usr/share/nginx/html;
	index index.html;

	# Relative 301s, so a mapped host port is not lost in the Location header.
	absolute_redirect off;

	# Raw markdown should display inline, not download.
	location ~ \.md$ {
		default_type text/plain;
	}

	# Missing assets must 404, not fall back to the single-page shell.
	location /assets/ {
		try_files $uri =404;
	}

	# Files and directory indexes as-is; everything else is the shell.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
